<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 World Cup Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/3.5.0/css/flag-icon.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #050505; 
            color: white;
            overflow-x: hidden;
        }

        /* --- Utilities --- */
        .neon-text { text-shadow: 0 0 10px rgba(204, 255, 0, 0.7); color: #ccff00; }
        .neon-border { border-color: #ccff00; box-shadow: 0 0 5px #ccff00; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* --- Components --- */
        .group-card {
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s;
        }
        .group-card:hover { border-color: #555; }

        .team-row {
            cursor: pointer;
            transition: all 0.2s;
        }
        .team-row:hover { background: rgba(255,255,255,0.05); }
        .team-row.selected-swap {
            background: rgba(204, 255, 0, 0.2);
            border-left: 2px solid #ccff00;
        }

        .pos-badge {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            border-radius: 50%;
            background: #333;
            color: #888;
        }
        .pos-1 { background: #ccff00; color: black; }
        .pos-2 { background: #fff; color: black; }
        .pos-3 { background: #666; color: white; }

        /* Bracket Specifics */
        .connector { border-color: #333; border-style: solid; border-width: 0; }
        .connector.active { border-color: #ccff00; box-shadow: 0 0 4px #ccff00; }
        .bracket-team-card.selected { background: #ccff00; color: black; font-weight: bold; box-shadow: 0 0 15px #ccff00; }
        .winner-final { background: linear-gradient(45deg, #FFD700, #ccff00); color: black; transform: scale(1.1); }
        
        /* Animation */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-6">

    <!-- Header -->
    <header class="text-center mb-6 z-10 relative px-4 w-full">
        <h2 class="text-xs md:text-sm font-bold tracking-[0.3em] text-gray-500 uppercase mb-2">FIFA World Cup 2026™</h2>
        <h1 class="text-2xl md:text-4xl font-black text-white mb-2 italic">TOURNAMENT <span class="text-[#ccff00]">SIMULATOR</span></h1>
        
        <!-- Navigation / Status -->
        <div class="flex justify-center space-x-4 mt-4" id="nav-steps">
            <div id="step-groups" class="flex items-center space-x-2 text-[#ccff00]">
                <span class="w-6 h-6 rounded-full border border-[#ccff00] flex items-center justify-center text-xs font-bold">1</span>
                <span class="text-xs font-bold tracking-wider">GROUP STAGE</span>
            </div>
            <div class="w-8 h-px bg-gray-700 my-auto"></div>
            <div id="step-bracket" class="flex items-center space-x-2 text-gray-600">
                <span class="w-6 h-6 rounded-full border border-gray-600 flex items-center justify-center text-xs font-bold">2</span>
                <span class="text-xs font-bold tracking-wider">KNOCKOUT</span>
            </div>
        </div>
    </header>

    <!-- CONTENT CONTAINER -->
    <main id="app-content" class="w-full max-w-[1800px] px-4">
        <!-- Views will be injected here -->
    </main>

    <!-- Floating Action Button -->
    <div class="fixed bottom-6 left-0 right-0 flex justify-center pointer-events-none z-50">
        <button id="action-btn" class="pointer-events-auto bg-[#ccff00] hover:bg-white text-black font-black py-3 px-8 rounded-full shadow-[0_0_20px_rgba(204,255,0,0.4)] transition-all transform hover:scale-105 flex items-center space-x-2 hidden">
            <span>GENERATE BRACKET</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
    </div>

    <script>
        // --- 1. FULL TEAM DATABASE (48 Teams) ---
        const teams = {
            // Pot 1 (Heads)
            'es': { name: 'Spain', code: 'es' },
            'fr': { name: 'France', code: 'fr' },
            'gb-eng': { name: 'England', code: 'gb-eng' },
            'de': { name: 'Germany', code: 'de' },
            'br': { name: 'Brazil', code: 'br' },
            'pt': { name: 'Portugal', code: 'pt' },
            'ar': { name: 'Argentina', code: 'ar' },
            'nl': { name: 'Netherlands', code: 'nl' },
            'be': { name: 'Belgium', code: 'be' },
            'it': { name: 'Italy', code: 'it' },
            'uy': { name: 'Uruguay', code: 'uy' },
            'us': { name: 'USA', code: 'us' }, // Host

            // Pot 2
            'hr': { name: 'Croatia', code: 'hr' },
            'mx': { name: 'Mexico', code: 'mx' }, // Host
            'ma': { name: 'Morocco', code: 'ma' },
            'jp': { name: 'Japan', code: 'jp' },
            'sn': { name: 'Senegal', code: 'sn' },
            'ir': { name: 'Iran', code: 'ir' },
            'dk': { name: 'Denmark', code: 'dk' },
            'kr': { name: 'South Korea', code: 'kr' },
            'ch': { name: 'Switzerland', code: 'ch' },
            'co': { name: 'Colombia', code: 'co' },
            'au': { name: 'Australia', code: 'au' },
            'ua': { name: 'Ukraine', code: 'ua' },

            // Pot 3 & 4 (Mix)
            'ca': { name: 'Canada', code: 'ca' }, // Host
            'ng': { name: 'Nigeria', code: 'ng' },
            'eg': { name: 'Egypt', code: 'eg' },
            'tn': { name: 'Tunisia', code: 'tn' },
            'dz': { name: 'Algeria', code: 'dz' },
            'cm': { name: 'Cameroon', code: 'cm' },
            'sa': { name: 'Saudi Arabia', code: 'sa' },
            'qa': { name: 'Qatar', code: 'qa' },
            'ec': { name: 'Ecuador', code: 'ec' },
            'py': { name: 'Paraguay', code: 'py' },
            'cl': { name: 'Chile', code: 'cl' },
            'pe': { name: 'Peru', code: 'pe' },
            'pl': { name: 'Poland', code: 'pl' },
            'rs': { name: 'Serbia', code: 'rs' },
            'tr': { name: 'Turkey', code: 'tr' },
            'at': { name: 'Austria', code: 'at' },
            'se': { name: 'Sweden', code: 'se' },
            'hu': { name: 'Hungary', code: 'hu' },
            'cz': { name: 'Czech Rep.', code: 'cz' },
            'sc': { name: 'Scotland', code: 'gb-sct' },
            'pa': { name: 'Panama', code: 'pa' },
            'cr': { name: 'Costa Rica', code: 'cr' },
            'jm': { name: 'Jamaica', code: 'jm' },
            'nz': { name: 'New Zealand', code: 'nz' }
        };

        // --- 2. INITIAL GROUP STATE (Simulated Draw) ---
        // 12 Groups of 4
        let groupState = {
            'A': ['es', 'hr', 'qa', 'nz'],
            'B': ['it', 'ch', 'ng', 'jm'],
            'C': ['fr', 'ua', 'kr', 'pa'],
            'D': ['de', 'dk', 'ec', 'sa'],
            'E': ['ma', 'pl', 'ir', 'cr'],
            'F': ['be', 'at', 'dz', 'sc'],
            'G': ['br', 'rs', 'sn', 'hu'],
            'H': ['nl', 'co', 'jp', 'se'],
            'I': ['gb-eng', 'us', 'tn', 'cz'], // USA host path
            'J': ['ar', 'mx', 'cm', 'tr'], // Mexico host path
            'K': ['pt', 'ca', 'eg', 'pe'], // Canada host path
            'L': ['uy', 'au', 'cl', 'py']
        };

        // Track user interaction
        let swapSource = null; // { group: 'A', index: 0 }
        let bracketState = {}; // Stores winners of knockout matches

        // --- 3. INIT ---
        const contentDiv = document.getElementById('app-content');
        const actionBtn = document.getElementById('action-btn');

        function init() {
            renderGroupStage();
            actionBtn.classList.remove('hidden');
            actionBtn.onclick = generateBracket;
        }

        // --- 4. VIEW: GROUP STAGE ---
        function renderGroupStage() {
            contentDiv.innerHTML = `
                <div class="text-center mb-8 fade-in">
                    <p class="text-gray-400 text-sm max-w-lg mx-auto">
                        <span class="text-[#ccff00]">INSTRUCTIONS:</span> Click a team to select, then click another in the same group to <span class="text-white font-bold">SWAP</span> positions.
                        The top 2 advance automatically. The 8 best 3rd-place teams also advance.
                    </p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 pb-20 fade-in" id="groups-grid">
                    <!-- Groups injected here -->
                </div>
            `;

            const grid = document.getElementById('groups-grid');
            
            Object.keys(groupState).forEach(grpKey => {
                const grpDiv = document.createElement('div');
                grpDiv.className = 'group-card p-4 relative';
                grpDiv.innerHTML = `<div class="absolute top-2 right-4 text-4xl font-black text-gray-800 pointer-events-none">${grpKey}</div>
                                    <h3 class="text-[#ccff00] font-bold text-lg mb-3 border-b border-gray-800 pb-1">GROUP ${grpKey}</h3>`;
                
                const list = document.createElement('div');
                list.className = 'space-y-1';
                
                groupState[grpKey].forEach((teamCode, idx) => {
                    const t = teams[teamCode];
                    const row = document.createElement('div');
                    row.className = 'team-row flex items-center p-2 rounded';
                    row.onclick = () => handleTeamClick(grpKey, idx);
                    row.id = `row-${grpKey}-${idx}`;

                    // Pos Badge
                    let posClass = idx === 0 ? 'pos-1' : (idx === 1 ? 'pos-2' : (idx === 2 ? 'pos-3' : 'bg-gray-800 text-gray-600'));
                    
                    row.innerHTML = `
                        <div class="pos-badge ${posClass} mr-3">${idx + 1}</div>
                        <span class="flag-icon flag-icon-${t.code} w-5 h-4 shadow-sm mr-3"></span>
                        <span class="text-sm font-bold text-gray-300 uppercase flex-grow">${t.name}</span>
                        ${idx < 2 ? '<span class="text-[9px] text-[#ccff00] font-mono">Q</span>' : ''}
                        ${idx === 2 ? '<span class="text-[9px] text-gray-500 font-mono third-label">?</span>' : ''}
                    `;
                    list.appendChild(row);
                });
                grpDiv.appendChild(list);
                grid.appendChild(grpDiv);
            });
            
            highlightQualifyingThirds();
        }

        function handleTeamClick(group, index) {
            // Remove previous highlights
            document.querySelectorAll('.selected-swap').forEach(el => el.classList.remove('selected-swap'));

            if (swapSource && swapSource.group === group) {
                // Swap logic
                if (swapSource.index !== index) {
                    const temp = groupState[group][swapSource.index];
                    groupState[group][swapSource.index] = groupState[group][index];
                    groupState[group][index] = temp;
                    renderGroupStage(); // Re-render to show change
                }
                swapSource = null;
            } else {
                // Select source
                swapSource = { group, index };
                const row = document.getElementById(`row-${group}-${index}`);
                if(row) row.classList.add('selected-swap');
            }
        }

        function highlightQualifyingThirds() {
            // In a real simulation, we'd rank them by points.
            // Here, we simplify: The first 8 groups (A-H) provide the 3rd place teams by default for the demo.
            // Or better: Let's just visually mark A-H 3rd places as "Q" for now to match the "Scenario" where top seeds perform well.
            // Real logic: Just pick 8. Let's pick A, B, C, D, E, F, G, H for consistency with the bracket logic below.
            
            const bestGroups = ['A','B','C','D','E','F','G','H'];
            
            bestGroups.forEach(g => {
                const row = document.getElementById(`row-${g}-2`); // Index 2 is 3rd place
                if(row) {
                    const label = row.querySelector('.third-label');
                    if(label) {
                        label.innerText = 'Q';
                        label.className = 'text-[9px] text-gray-400 font-mono';
                    }
                    const badge = row.querySelector('.pos-badge');
                    if(badge) {
                        badge.style.background = '#888';
                        badge.style.color = '#fff';
                    }
                }
            });
        }

        // --- 5. LOGIC: BRACKET GENERATION ---
        
        function generateBracket() {
            // 1. Switch UI
            document.getElementById('step-groups').classList.replace('text-[#ccff00]', 'text-gray-600');
            document.getElementById('step-groups').querySelector('div, span').classList.remove('border-[#ccff00]');
            document.getElementById('step-groups').querySelector('span').classList.add('border-gray-600'); // Fix border style manually if needed

            document.getElementById('step-bracket').classList.replace('text-gray-600', 'text-[#ccff00]');
            document.getElementById('step-bracket').querySelector('span').classList.remove('border-gray-600');
            document.getElementById('step-bracket').querySelector('span').classList.add('border-[#ccff00]');
            
            actionBtn.style.display = 'none';

            // 2. Map Group Results to Bracket Slots
            /* FIFA 2026 R32 Structure (Simplified for Official Pathway approximation):
               We need to map "Winner A" to a specific match.
            */
           
            const g = (grp, pos) => groupState[grp][pos-1]; // Helper to get team code
            
            // Note: In strict FIFA rules, 3rd place matchups depend on the specific combo of 8 teams.
            // We will use a standard "Grid" assumption for A-H qualifying.
            // Rules Source: Common projection for R32.

            const matches = [
                // --- LEFT BRACKET ---
                // Q1
                { id: 'r32-l1', t1: g('A',1), t2: g('C',3), label: 'A1 vs C3', next: 'r16-l1', slot: 1 },
                { id: 'r32-l2', t1: g('B',1), t2: g('G',2), label: 'B1 vs G2', next: 'r16-l1', slot: 2 },
                
                { id: 'r32-l3', t1: g('D',1), t2: g('B',3), label: 'D1 vs B3', next: 'r16-l2', slot: 1 },
                { id: 'r32-l4', t1: g('E',1), t2: g('H',2), label: 'E1 vs H2', next: 'r16-l2', slot: 2 },

                // Q2
                { id: 'r32-l5', t1: g('C',1), t2: g('F',2), label: 'C1 vs F2', next: 'r16-l3', slot: 1 },
                { id: 'r32-l6', t1: g('F',1), t2: g('C',2), label: 'F1 vs C2', next: 'r16-l3', slot: 2 }, // Using C2 as placeholder logic
                
                { id: 'r32-l7', t1: g('G',1), t2: g('A',3), label: 'G1 vs A3', next: 'r16-l4', slot: 1 },
                { id: 'r32-l8', t1: g('H',1), t2: g('E',2), label: 'H1 vs E2', next: 'r16-l4', slot: 2 },

                // --- RIGHT BRACKET ---
                // Q3
                { id: 'r32-r1', t1: g('I',1), t2: g('L',3), label: 'I1 vs L3', next: 'r16-r1', slot: 1 }, // Fallback 3rd
                { id: 'r32-r2', t1: g('J',2), t2: g('K',2), label: 'J2 vs K2', next: 'r16-r1', slot: 2 },

                { id: 'r32-r3', t1: g('L',1), t2: g('I',3), label: 'L1 vs I3', next: 'r16-r2', slot: 1 }, // Fallback 3rd
                { id: 'r32-r4', t1: g('I',2), t2: g('L',2), label: 'I2 vs L2', next: 'r16-r2', slot: 2 },

                // Q4 (The Arg/Por zone)
                { id: 'r32-r5', t1: g('K',1), t2: g('D',3), label: 'K1 vs D3', next: 'r16-r3', slot: 1 }, // Fallback 3rd
                { id: 'r32-r6', t1: g('B',2), t2: g('A',2), label: 'B2 vs A2', next: 'r16-r3', slot: 2 }, 

                { id: 'r32-r7', t1: g('J',1), t2: g('H',3), label: 'J1 vs H3', next: 'r16-r4', slot: 1 }, // Fallback 3rd
                { id: 'r32-r8', t1: g('D',2), t2: g('E',2), label: 'D2 vs E2', next: 'r16-r4', slot: 2 } 
            ];

            // Some manual cleanup to ensure no duplicates if I mapped lazily above
            // (In a full app, we use a rigid assignment table)

            renderBracket(matches);
        }

        // --- 6. VIEW: BRACKET ---
        function renderBracket(matches) {
            contentDiv.innerHTML = `
                <div class="w-full overflow-x-auto no-scrollbar pb-20 flex justify-center fade-in">
                    <div class="min-w-[1600px] flex justify-center items-center relative py-4">
                        <!-- Left -->
                        <div class="flex flex-col justify-around h-[1000px] w-48 mr-2 space-y-3" id="r32-left"></div>
                        <div class="flex flex-col justify-around h-[1000px] w-44 mr-4" id="r16-l"></div>
                        <div class="flex flex-col justify-around h-[1000px] w-44 mr-4" id="qf-l"></div>
                        <div class="flex flex-col justify-center h-[1000px] w-44 mr-6 relative" id="sf-l">
                            <div class="absolute right-[-24px] top-1/2 w-6 border-t-2 connector"></div>
                        </div>

                        <!-- Center -->
                        <div class="flex flex-col justify-center items-center h-[1000px] w-64 z-20">
                            <div class="mb-8 w-full transform scale-110">
                                <div class="text-center text-gray-500 mb-2 font-bold tracking-widest text-xs">WORLD CHAMPION</div>
                                <div id="winner-slot" class="w-40 h-40 mx-auto neon-box bg-gray-900 rounded-lg flex flex-col items-center justify-center transition-all duration-500 relative overflow-hidden">
                                    <span class="text-5xl relative z-10">🏆</span>
                                    <span class="text-gray-500 text-[10px] mt-2 relative z-10 font-mono">SELECT WINNER</span>
                                </div>
                            </div>
                            <!-- Final Match -->
                            <div class="bg-gradient-to-b from-gray-800 to-gray-900 p-4 rounded-xl border border-gray-700 shadow-2xl w-full">
                                <div class="text-center text-[#ccff00] text-[10px] font-black tracking-widest mb-3">FINAL</div>
                                <div class="flex justify-between items-center space-x-2">
                                    <div id="final-team-1" class="w-20 h-24 bg-black/40 rounded flex flex-col items-center justify-center border border-gray-700"><span class="text-gray-600 text-xs">TBD</span></div>
                                    <div class="text-white font-black italic">VS</div>
                                    <div id="final-team-2" class="w-20 h-24 bg-black/40 rounded flex flex-col items-center justify-center border border-gray-700"><span class="text-gray-600 text-xs">TBD</span></div>
                                </div>
                            </div>
                        </div>

                        <!-- Right -->
                        <div class="flex flex-col justify-center h-[1000px] w-44 ml-6 relative" id="sf-r">
                            <div class="absolute left-[-24px] top-1/2 w-6 border-t-2 connector"></div>
                        </div>
                        <div class="flex flex-col justify-around h-[1000px] w-44 ml-4" id="qf-r"></div>
                        <div class="flex flex-col justify-around h-[1000px] w-44 ml-4" id="r16-r"></div>
                        <div class="flex flex-col justify-around h-[1000px] w-48 ml-2 space-y-3" id="r32-right"></div>
                    </div>
                </div>
            `;

            // Populate R32
            const lContainer = document.getElementById('r32-left');
            const rContainer = document.getElementById('r32-right');
            
            matches.slice(0, 8).forEach(m => lContainer.appendChild(createMatchCard(m, 'r32')));
            matches.slice(8, 16).forEach(m => rContainer.appendChild(createMatchCard(m, 'r32')));

            // Generate Empty Rounds
            createEmptySlots('r16-l', ['r16-l1','r16-l2','r16-l3','r16-l4'], 'left');
            createEmptySlots('r16-r', ['r16-r1','r16-r2','r16-r3','r16-r4'], 'right');
            createEmptySlots('qf-l', ['qf-l1','qf-l2'], 'left');
            createEmptySlots('qf-r', ['qf-r1','qf-r2'], 'right');
            createEmptySlots('sf-l', ['sf-l1'], 'left', true);
            createEmptySlots('sf-r', ['sf-r1'], 'right', true);
        }

        // --- Helper DOM Functions ---

        function createEmptySlots(containerId, ids, side, single=false) {
            const cont = document.getElementById(containerId);
            ids.forEach((id, i) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'relative flex flex-col justify-center w-full';
                if (!single) {
                    const conn = document.createElement('div');
                    conn.className = `absolute ${side === 'left' ? 'left-[-16px]' : 'right-[-16px]'} top-1/2 w-4 border-t-2 connector`;
                    conn.id = `conn-in-${id}`;
                    wrapper.appendChild(conn);
                }
                wrapper.appendChild(createMatchCard({ id }, 'empty'));
                cont.appendChild(wrapper);
            });
        }

        function createMatchCard(m, type) {
            const el = document.createElement('div');
            el.className = 'w-full bg-gray-900 rounded border border-gray-800 shadow-md relative overflow-hidden group';
            el.id = `card-${m.id}`;
            
            if(type === 'r32') {
                const t1 = teams[m.t1] || {name:'Unknown', code:'un'};
                const t2 = teams[m.t2] || {name:'Unknown', code:'un'};
                el.innerHTML = `
                    <div class="bg-black/40 px-2 py-1 flex justify-between items-center border-b border-gray-800">
                        <span class="text-[9px] text-gray-500 uppercase tracking-widest">${m.label}</span>
                    </div>
                    ${createTeamRow(m.id, m.t1, t1, m.next, m.slot)}
                    <div class="h-px bg-gray-800 w-full"></div>
                    ${createTeamRow(m.id, m.t2, t2, m.next, m.slot)}
                `;
            } else {
                el.innerHTML = `
                    <div id="${m.id}-slot-1" class="p-2 flex items-center h-10 cursor-default team-row"><span class="text-gray-700 text-[10px] font-mono">WAITING</span></div>
                    <div class="h-px bg-gray-800 w-full"></div>
                    <div id="${m.id}-slot-2" class="p-2 flex items-center h-10 cursor-default team-row"><span class="text-gray-700 text-[10px] font-mono">WAITING</span></div>
                `;
            }
            return el;
        }

        function createTeamRow(matchId, teamCode, teamData, nextId, nextSlot) {
            return `
                <div class="p-2 flex items-center justify-between cursor-pointer hover:bg-white/5 transition-colors team-row h-10"
                     data-match="${matchId}" data-team="${teamCode}"
                     onclick="selectWinner('${matchId}', '${teamCode}', '${nextId}', ${nextSlot})">
                    <div class="flex items-center space-x-2 w-full overflow-hidden">
                        <span class="flag-icon flag-icon-${teamData.code} w-4 h-3 flex-shrink-0"></span>
                        <span class="text-[11px] font-bold text-gray-300 truncate uppercase team-name">${teamData.name}</span>
                    </div>
                    <div class="check-icon opacity-0 text-[#ccff00] text-xs">✓</div>
                </div>
            `;
        }

        // --- Logic: Bracket Selection ---
        // (Re-using simplified logic from previous iterations, focusing on flow)
        
        const roundStructure = {
            'r32-l1': { next: 'r16-l1', slot: 1 }, 'r32-l2': { next: 'r16-l1', slot: 2 },
            'r32-l3': { next: 'r16-l2', slot: 1 }, 'r32-l4': { next: 'r16-l2', slot: 2 },
            'r32-l5': { next: 'r16-l3', slot: 1 }, 'r32-l6': { next: 'r16-l3', slot: 2 },
            'r32-l7': { next: 'r16-l4', slot: 1 }, 'r32-l8': { next: 'r16-l4', slot: 2 },
            'r32-r1': { next: 'r16-r1', slot: 1 }, 'r32-r2': { next: 'r16-r1', slot: 2 },
            'r32-r3': { next: 'r16-r2', slot: 1 }, 'r32-r4': { next: 'r16-r2', slot: 2 },
            'r32-r5': { next: 'r16-r3', slot: 1 }, 'r32-r6': { next: 'r16-r3', slot: 2 },
            'r32-r7': { next: 'r16-r4', slot: 1 }, 'r32-r8': { next: 'r16-r4', slot: 2 },
            'r16-l1': { next: 'qf-l1', slot: 1 }, 'r16-l2': { next: 'qf-l1', slot: 2 },
            'r16-l3': { next: 'qf-l2', slot: 1 }, 'r16-l4': { next: 'qf-l2', slot: 2 },
            'r16-r1': { next: 'qf-r1', slot: 1 }, 'r16-r2': { next: 'qf-r1', slot: 2 },
            'r16-r3': { next: 'qf-r2', slot: 1 }, 'r16-r4': { next: 'qf-r2', slot: 2 },
            'qf-l1': { next: 'sf-l1', slot: 1 }, 'qf-l2': { next: 'sf-l1', slot: 2 },
            'qf-r1': { next: 'sf-r1', slot: 1 }, 'qf-r2': { next: 'sf-r1', slot: 2 },
            'sf-l1': { next: 'final', slot: 1 }, 'sf-r1': { next: 'final', slot: 2 }
        };

        function selectWinner(matchId, teamCode, nextId, nextSlot) {
            if(!teamCode || teamCode === 'un') return;
            
            bracketState[matchId] = teamCode;
            updateVisuals(matchId, teamCode);
            propagate(nextId, nextSlot, teamCode);

            const conn = document.getElementById(`conn-in-${nextId}`);
            if(conn) conn.classList.add('active');
        }

        function updateVisuals(matchId, winnerCode) {
            const card = document.getElementById(`card-${matchId}`);
            if(!card) return;
            card.classList.add('neon-border');
            card.querySelectorAll('.team-row').forEach(row => {
                const isWinner = row.getAttribute('data-team') === winnerCode;
                const name = row.querySelector('.team-name');
                const check = row.querySelector('.check-icon');
                
                if(isWinner) {
                    row.classList.add('bg-[#ccff00]', 'text-black');
                    row.classList.remove('hover:bg-white/5');
                    if(name) { name.classList.remove('text-gray-300'); name.classList.add('text-black'); }
                    if(check) check.classList.remove('opacity-0');
                } else {
                    row.classList.remove('bg-[#ccff00]', 'text-black');
                    if(name) { name.classList.add('text-gray-300'); name.classList.remove('text-black'); }
                    if(check) check.classList.add('opacity-0');
                }
            });
        }

        function propagate(matchId, slot, teamCode) {
            if(matchId === 'final') { updateFinal(slot, teamCode); return; }
            
            const slotEl = document.getElementById(`${matchId}-slot-${slot}`);
            const t = teams[teamCode];
            
            slotEl.innerHTML = `
                <div class="flex items-center space-x-2 overflow-hidden w-full">
                    <span class="flag-icon flag-icon-${t.code} w-4 h-3 flex-shrink-0 shadow-sm"></span>
                    <span class="text-[11px] font-bold text-white truncate uppercase team-name">${t.name}</span>
                </div>
                <div class="check-icon opacity-0 ml-auto text-[#ccff00] text-xs">✓</div>
            `;
            slotEl.setAttribute('data-team', teamCode);
            slotEl.classList.remove('cursor-default');
            slotEl.classList.add('cursor-pointer', 'hover:bg-white/5');
            
            slotEl.onclick = () => {
                const next = roundStructure[matchId];
                if(next) selectWinner(matchId, teamCode, next.next, next.slot);
            };

            // Check if current match needs reset (if we switched a previous winner)
            if(bracketState[matchId]) {
                 const s1 = document.getElementById(`${matchId}-slot-1`).getAttribute('data-team');
                 const s2 = document.getElementById(`${matchId}-slot-2`).getAttribute('data-team');
                 if(bracketState[matchId] !== s1 && bracketState[matchId] !== s2) {
                     // Reset visual
                     delete bracketState[matchId];
                     const card = document.getElementById(`card-${matchId}`);
                     card.classList.remove('neon-border');
                     card.querySelectorAll('.team-row').forEach(r => {
                         r.classList.remove('bg-[#ccff00]', 'text-black');
                         r.querySelector('.check-icon').classList.add('opacity-0');
                         r.querySelector('.team-name').classList.add('text-gray-300');
                     });
                     // Propagate reset? (Simplified: Just leave visuals for now, or clear next)
                 } else {
                     updateVisuals(matchId, bracketState[matchId]);
                 }
            }
        }

        function updateFinal(slot, teamCode) {
            const t = teams[teamCode];
            const el = document.getElementById(`final-team-${slot}`);
            el.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full">
                    <span class="flag-icon flag-icon-${t.code} text-3xl mb-1 shadow-lg"></span>
                    <span class="font-bold text-[10px] tracking-wider uppercase text-white">${t.name}</span>
                </div>
            `;
            el.classList.add('bg-black', 'border-[#ccff00]');
            el.setAttribute('data-team', teamCode);
            el.onclick = () => {
                const box = document.getElementById('winner-slot');
                box.innerHTML = `
                    <div class="absolute inset-0 bg-gradient-to-t from-yellow-500/20 to-transparent"></div>
                    <span class="flag-icon flag-icon-${t.code} text-6xl mb-2 drop-shadow-xl z-10 transform scale-125"></span>
                    <span class="text-white font-black text-2xl uppercase z-10">${t.name}</span>
                    <span class="bg-[#ccff00] text-black text-[10px] font-bold px-3 py-1 rounded mt-2 z-10">CHAMPION</span>
                `;
                box.classList.add('winner-final', 'shadow-[0_0_50px_#ccff00]');
            };
        }

        // Run
        init();

    </script>
</body>
</html>
