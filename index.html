<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 World Cup Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/3.5.0/css/flag-icon.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            emailjs.init("6Ma4qUlfZK1talrWN");
        })();
    </script>

    <!-- Mobile Drag & Drop Polyfill (Essential for iOS Safari) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/default.css">
    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/scroll-behaviour.min.js"></script>
    <script>
        // Apply polyfill
        MobileDragDrop.polyfill({
            dragImageTranslateOverride: MobileDragDrop.scrollBehaviourDragImageTranslateOverride
        });
        // Safari touch fix
        window.addEventListener('touchmove', function() {}, {passive: false});
    </script>

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #050505; 
            color: white;
            overflow-x: hidden;
            user-select: none; 
            -webkit-user-select: none; /* Safari Support */
            -webkit-touch-callout: none; /* Disable callout on long press */
        }

        /* --- Utilities --- */
        .neon-text { text-shadow: 0 0 10px rgba(204, 255, 0, 0.7); color: #ccff00; }
        .neon-border { border-color: #ccff00; box-shadow: 0 0 5px #ccff00; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* --- Components --- */
        .group-card {
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s;
        }
        .group-card:hover { border-color: #555; }

        .team-row {
            cursor: grab; /* Drag cursor */
            transition: all 0.2s;
            touch-action: none; /* Helps with touch dragging */
        }
        .team-row:active { cursor: grabbing; }
        .team-row:hover { background: rgba(255,255,255,0.05); }
        
        /* Drag & Drop Visuals */
        .team-row.dragging {
            opacity: 0.5;
            background: #333;
            border: 1px dashed #666;
        }
        .team-row.drag-over {
            background: rgba(204, 255, 0, 0.1);
            border-top: 2px solid #ccff00;
        }

        .pos-badge {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            border-radius: 50%;
            background: #333;
            color: #888;
        }
        .pos-1 { background: #ccff00; color: black; }
        .pos-2 { background: #fff; color: black; }
        .pos-3 { background: #666; color: white; }

        /* Bracket Specifics */
        .connector { border-color: #333; border-style: solid; border-width: 0; }
        .connector.active { border-color: #ccff00; box-shadow: 0 0 4px #ccff00; }
        .bracket-team-card.selected { background: #ccff00; color: black; font-weight: bold; box-shadow: 0 0 15px #ccff00; }
        .winner-final { background: linear-gradient(45deg, #FFD700, #ccff00); color: black; transform: scale(1.1); }
        
        /* Nav */
        .nav-step { cursor: pointer; transition: all 0.3s; opacity: 0.6; }
        .nav-step:hover { opacity: 1; }
        .nav-step.active { opacity: 1; }
        .nav-step.active span:first-child { border-color: #ccff00; color: #ccff00; }
        .nav-step.active span:last-child { color: #ccff00; }

        /* Animation */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-6">

    <!-- Header -->
    <header class="text-center mb-6 z-10 relative px-4 w-full">
        <!-- Tools (Reset/Undo) -->
        <div class="absolute top-0 right-4 flex space-x-2 mt-2">
            <button onclick="undoLastAction()" id="undo-btn" class="text-gray-500 hover:text-white text-[10px] font-bold uppercase tracking-wider px-3 py-1 border border-gray-800 rounded hover:border-gray-500 transition-colors disabled:opacity-30 disabled:cursor-not-allowed">
                Undo
            </button>
            <button onclick="showResetModal()" class="text-red-500 hover:text-red-400 text-[10px] font-bold uppercase tracking-wider px-3 py-1 border border-gray-800 rounded hover:border-red-900 transition-colors">
                Reset
            </button>
        </div>

        <h2 class="text-xs md:text-sm font-bold tracking-[0.3em] text-gray-500 uppercase mb-2">FIFA World Cup 2026™</h2>
        <h1 class="text-2xl md:text-4xl font-black text-white mb-2 italic">TOURNAMENT <span class="text-[#ccff00]">SIMULATOR</span></h1>
        
        <!-- Navigation / Status -->
        <div class="flex justify-center space-x-4 mt-4 select-none" id="nav-steps">
            <div id="step-groups" class="nav-step flex items-center space-x-2 active" onclick="switchToGroups()">
                <span class="w-6 h-6 rounded-full border border-gray-600 flex items-center justify-center text-xs font-bold transition-colors">1</span>
                <span class="text-xs font-bold tracking-wider transition-colors">GROUP STAGE</span>
            </div>
            <div class="w-8 h-px bg-gray-700 my-auto"></div>
            <div id="step-bracket" class="nav-step flex items-center space-x-2" onclick="generateBracket()">

                <span class="text-xs font-bold tracking-wider transition-colors">KNOCKOUT</span>
            </div>
        </div>
        
        <div class="text-center mt-2 h-4">
             <span id="save-status" class="text-[10px] text-gray-600 font-mono opacity-0 transition-opacity">SAVED</span>
        </div>
    </header>

    <!-- CONTENT CONTAINER -->
    <main id="app-content" class="w-full max-w-[1800px] px-4">
        <!-- Views will be injected here -->
    </main>

    <!-- Floating Action Button -->
    <div class="fixed bottom-6 left-0 right-0 flex justify-center pointer-events-none z-50 transition-opacity duration-300" id="action-container">
        <button id="action-btn" class="pointer-events-auto bg-[#ccff00] hover:bg-white text-black font-black py-3 px-8 rounded-full shadow-[0_0_20px_rgba(204,255,0,0.4)] transition-all transform hover:scale-105 flex items-center space-x-2 hidden">

            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
    </div>

    <!-- Contact Info Footer (Collapsible) -->
    <div class="fixed bottom-4 right-4 z-50 pointer-events-auto flex flex-col items-end">
        <button id="contact-show-btn" onclick="toggleContact()" class="hidden bg-black/80 backdrop-blur border border-gray-800 p-3 rounded-full shadow-lg text-[#ccff00] hover:bg-gray-900 transition-all hover:scale-110 group border-[#ccff00]/30" title="Show Contact">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
        </button>

        <div id="contact-card" class="bg-black/80 backdrop-blur border border-gray-800 p-3 rounded-lg shadow-lg text-[10px] text-gray-400 text-right relative transition-all origin-bottom-right">

            <a href="mailto:shanemchamed@gmail.com" class="block hover:text-white transition-colors">shanemchamed@gmail.com</a>

                @shaheenmohamed.m
            </a>
            <div class="mt-2 text-[8px] text-gray-600 font-mono text-right">v2.2</div>

    <!-- Reset Modal -->
    <div id="reset-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] hidden flex items-center justify-center">
        <div class="bg-gray-900 border border-gray-700 p-6 rounded-xl max-w-sm w-full mx-4 text-center shadow-2xl">
            <h3 class="text-white font-bold text-lg mb-2">Reset Tournament?</h3>
            <p class="text-gray-400 text-sm mb-6">This will clear all your predictions and return to the default start.</p>
            <div class="flex space-x-3 justify-center">
                <button onclick="hideResetModal()" class="px-4 py-2 rounded bg-gray-800 text-gray-300 hover:bg-gray-700 text-xs font-bold transition-colors">CANCEL</button>
                <button onclick="confirmReset()" class="px-4 py-2 rounded bg-red-600 text-white hover:bg-red-500 text-xs font-bold transition-colors shadow-lg shadow-red-900/50">CONFIRM RESET</button>
            </div>
        </div>

    <script>
        // --- 1. FULL TEAM DATABASE ---
        const teams = {
            'mx': { name: 'Mexico', code: 'mx' }, 'za': { name: 'South Africa', code: 'za' }, 'kr': { name: 'South Korea', code: 'kr' }, 'cz': { name: 'Czechia', code: 'cz' },
            'ca': { name: 'Canada', code: 'ca' }, 'ba': { name: 'Bosnia & Herz.', code: 'ba' }, 'qa': { name: 'Qatar', code: 'qa' }, 'ch': { name: 'Switzerland', code: 'ch' },
            'br': { name: 'Brazil', code: 'br' }, 'ma': { name: 'Morocco', code: 'ma' }, 'ht': { name: 'Haiti', code: 'ht' }, 'gb-sct': { name: 'Scotland', code: 'gb-sct' },
            'us': { name: 'USA', code: 'us' }, 'py': { name: 'Paraguay', code: 'py' }, 'au': { name: 'Australia', code: 'au' }, 'tr': { name: 'Türkiye', code: 'tr' },
            'de': { name: 'Germany', code: 'de' }, 'cw': { name: 'Curaçao', code: 'cw' }, 'ci': { name: 'Ivory Coast', code: 'ci' }, 'ec': { name: 'Ecuador', code: 'ec' },
            'nl': { name: 'Netherlands', code: 'nl' }, 'jp': { name: 'Japan', code: 'jp' }, 'se': { name: 'Sweden', code: 'se' }, 'tn': { name: 'Tunisia', code: 'tn' },
            'be': { name: 'Belgium', code: 'be' }, 'eg': { name: 'Egypt', code: 'eg' }, 'ir': { name: 'Iran', code: 'ir' }, 'nz': { name: 'New Zealand', code: 'nz' },
            'es': { name: 'Spain', code: 'es' }, 'cv': { name: 'Cape Verde', code: 'cv' }, 'sa': { name: 'Saudi Arabia', code: 'sa' }, 'uy': { name: 'Uruguay', code: 'uy' },
            'fr': { name: 'France', code: 'fr' }, 'sn': { name: 'Senegal', code: 'sn' }, 'iq': { name: 'Iraq', code: 'iq' }, 'no': { name: 'Norway', code: 'no' },
            'ar': { name: 'Argentina', code: 'ar' }, 'dz': { name: 'Algeria', code: 'dz' }, 'at': { name: 'Austria', code: 'at' }, 'jo': { name: 'Jordan', code: 'jo' },
            'pt': { name: 'Portugal', code: 'pt' }, 'cd': { name: 'DR Congo', code: 'cd' }, 'uz': { name: 'Uzbekistan', code: 'uz' }, 'co': { name: 'Colombia', code: 'co' },
            'gb-eng': { name: 'England', code: 'gb-eng' }, 'hr': { name: 'Croatia', code: 'hr' }, 'gh': { name: 'Ghana', code: 'gh' }, 'pa': { name: 'Panama', code: 'pa' }
        };

        // --- 2. STATE MANAGEMENT & STORAGE ---
        const defaultGroupState = {
            'A': ['mx', 'za', 'kr', 'cz'], 'B': ['ca', 'ba', 'qa', 'ch'], 'C': ['br', 'ma', 'ht', 'gb-sct'],
            'D': ['us', 'py', 'au', 'tr'], 'E': ['de', 'cw', 'ci', 'ec'], 'F': ['nl', 'jp', 'se', 'tn'],
            'G': ['be', 'eg', 'ir', 'nz'], 'H': ['es', 'cv', 'sa', 'uy'], 'I': ['fr', 'sn', 'iq', 'no'], 
            'J': ['ar', 'dz', 'at', 'jo'], 'K': ['pt', 'cd', 'uz', 'co'], 'L': ['gb-eng', 'hr', 'gh', 'pa']
        };

        let groupState = {};
        let bracketState = {}; 
        let selectedThirds = []; // Array of group letters (e.g. ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'])
        let currentView = 'groups'; 
        let historyStack = []; 
        let FIFA_LOOKUP_TABLE = {}; // Cache for the 495 matrices

        function loadState() {
            // Version 22 to cleanly reset local storage back to the PDF logic
            const savedGroups = localStorage.getItem('wc26_groups_v22');
            const savedBracket = localStorage.getItem('wc26_bracket_v22');
            const savedThirds = localStorage.getItem('wc26_thirds_v22');
            const savedView = localStorage.getItem('wc26_view_v22');

            groupState = savedGroups ? JSON.parse(savedGroups) : JSON.parse(JSON.stringify(defaultGroupState));
            bracketState = savedBracket ? JSON.parse(savedBracket) : {};
            selectedThirds = savedThirds ? JSON.parse(savedThirds) : ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
            currentView = savedView || 'groups';
            
            updateUndoButton();
        }

        function saveEverything() {
            localStorage.setItem('wc26_groups_v22', JSON.stringify(groupState));
            localStorage.setItem('wc26_bracket_v22', JSON.stringify(bracketState));
            localStorage.setItem('wc26_thirds_v22', JSON.stringify(selectedThirds));
            localStorage.setItem('wc26_view_v22', currentView);
            
            const status = document.getElementById('save-status');
            if(status) {
                status.style.opacity = '1';
                setTimeout(() => { status.style.opacity = '0'; }, 1000);
            }
        }

        // --- 3. HISTORY (UNDO) SYSTEM ---
        function pushHistory() {
            const snapshot = {
                groups: JSON.parse(JSON.stringify(groupState)),
                bracket: JSON.parse(JSON.stringify(bracketState)),
                thirds: JSON.parse(JSON.stringify(selectedThirds)),
                view: currentView
            };
            historyStack.push(JSON.stringify(snapshot));
            if(historyStack.length > 50) historyStack.shift(); 
            updateUndoButton();
        }

        function undoLastAction() {
            if (historyStack.length === 0) return;
            const prevState = JSON.parse(historyStack.pop());
            
            groupState = prevState.groups;
            bracketState = prevState.bracket;
            selectedThirds = prevState.thirds;
            
            saveEverything();
            updateUndoButton();
            
            if (currentView === 'groups') {
                renderGroupStage();
            } else {
                renderBracket(getBracketMatches()); 
            }
        }

        function updateUndoButton() {
            const btn = document.getElementById('undo-btn');
            btn.disabled = historyStack.length === 0;
            btn.innerHTML = `UNDO ${historyStack.length > 0 ? '(' + historyStack.length + ')' : ''}`;
        }

        // --- 4. RESET SYSTEM ---
        function showResetModal() { document.getElementById('reset-modal').classList.remove('hidden'); }
        function hideResetModal() { document.getElementById('reset-modal').classList.add('hidden'); }

        function confirmReset() {
            localStorage.removeItem('wc26_groups_v22');
            localStorage.removeItem('wc26_bracket_v22');
            localStorage.removeItem('wc26_thirds_v22');
            localStorage.removeItem('wc26_view_v22');
            
            groupState = JSON.parse(JSON.stringify(defaultGroupState));
            bracketState = {};
            selectedThirds = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
            currentView = 'groups';
            historyStack = [];
            
            hideResetModal();
            switchToGroups();
            updateUndoButton();
        }

        // --- 5. INIT & VIEW SWITCHING ---
        const contentDiv = document.getElementById('app-content');
        const actionBtn = document.getElementById('action-btn');

        function init() {
            generateFIFATable(); // Build 495 Matrix on boot
            loadState();
            if (currentView === 'bracket') {
                generateBracket(); 
            } else {
                switchToGroups(); 
            }
        }

        function switchToGroups() {
            currentView = 'groups';
            saveEverything();
            
            document.getElementById('step-groups').classList.add('active');
            document.getElementById('step-bracket').classList.remove('active');
            actionBtn.onclick = generateBracket;

            renderGroupStage();
        }

        function toggleContact() {
            const card = document.getElementById('contact-card');
            const btn = document.getElementById('contact-show-btn');
            if (card.classList.contains('hidden')) {
                card.classList.remove('hidden');
                btn.classList.add('hidden');
            } else {
                card.classList.add('hidden');
                btn.classList.remove('hidden');
            }
        }

        // --- 6. VIEW: GROUP STAGE & THIRD PLACE SELECTION ---
        let dragSrcEl = null; let dragSrcGroup = null; let dragSrcIndex = null;

        function renderGroupStage() {
            const allSelected = selectedThirds.length === 8;
            
            contentDiv.innerHTML = `
                <div class="text-center mb-8 fade-in">
                    <p class="text-gray-400 text-sm max-w-2xl mx-auto">
                        <span class="text-[#ccff00] font-bold">1.</span> <span class="text-white">HOLD, DRAG AND DROP</span> teams within groups to set the standings.<br>
                        <span class="text-[#ccff00] font-bold">2.</span> <span class="text-white">SELECT exactly 8 Best 3rd-Place teams</span> by clicking the [?] buttons.
                    </p>
                    <div id="thirds-tracker" class="mt-4 inline-block px-4 py-2 rounded-full border transition-colors duration-300 ${allSelected ? 'border-[#ccff00] text-[#ccff00] bg-[#ccff00]/10' : 'border-gray-600 text-gray-400'} font-bold text-xs tracking-wider">
                        ${selectedThirds.length}/8 THIRD PLACE TEAMS QUALIFIED
                    </div>
                    ${allSelected ? `<div class="text-[#ccff00] mt-2 text-[10px] font-mono opacity-80">FIFA 495-MATRIX COMBINATION: <b>${[...selectedThirds].sort().join('')}</b></div>` : ''}
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 pb-24 fade-in" id="groups-grid"></div>
            `;

            const grid = document.getElementById('groups-grid');
            
            Object.keys(groupState).forEach(grpKey => {
                const grpDiv = document.createElement('div');
                grpDiv.className = 'group-card p-4 relative';
                grpDiv.innerHTML = `<div class="absolute top-2 right-4 text-4xl font-black text-gray-800 pointer-events-none">${grpKey}</div>
                                    <h3 class="text-[#ccff00] font-bold text-lg mb-3 border-b border-gray-800 pb-1">GROUP ${grpKey}</h3>`;
                
                const list = document.createElement('div');
                list.className = 'space-y-1';
                
                groupState[grpKey].forEach((teamCode, idx) => {
                    const t = teams[teamCode] || {name: 'Unknown', code: 'un'};
                    const row = document.createElement('div');
                    row.className = 'team-row flex items-center p-2 rounded';
                    row.draggable = true;
                    row.id = `row-${grpKey}-${idx}`;
                    
                    row.addEventListener('dragstart', (e) => handleDragStart(e, grpKey, idx));
                    row.addEventListener('dragover', handleDragOver);
                    row.addEventListener('dragleave', handleDragLeave);
                    row.addEventListener('drop', (e) => handleDrop(e, grpKey, idx));
                    row.addEventListener('dragend', handleDragEnd);

                    const isThirdSelected = (idx === 2 && selectedThirds.includes(grpKey));
                    
                    let posClass = idx === 0 ? 'pos-1' : (idx === 1 ? 'pos-2' : (idx === 2 ? 'pos-3' : 'bg-gray-800 text-gray-600'));
                    if (isThirdSelected) posClass = 'bg-[#ccff00]/80 text-black'; 
                    
                    let extraUI = '';
                    if (idx < 2) {
                        extraUI = '<span class="text-[9px] text-[#ccff00] font-mono pointer-events-none">Q</span>';
                    } else if (idx === 2) {
                        extraUI = `
                            <button onclick="toggleThird(event, '${grpKey}')" class="w-7 h-6 rounded flex items-center justify-center font-mono text-[11px] font-black transition-all cursor-pointer ${isThirdSelected ? 'bg-[#ccff00] text-black shadow-[0_0_8px_rgba(204,255,0,0.4)]' : 'bg-gray-700 text-gray-400 hover:bg-gray-500'}">
                                ${isThirdSelected ? 'Q' : '?'}
                            </button>
                        `;
                    }

                    row.innerHTML = `
                        <div class="pos-badge ${posClass} mr-3 pointer-events-none transition-colors">${idx + 1}</div>
                        <span class="flag-icon flag-icon-${t.code} w-5 h-4 shadow-sm mr-3 pointer-events-none"></span>
                        <span class="text-sm font-bold ${isThirdSelected ? 'text-white' : 'text-gray-300'} uppercase flex-grow pointer-events-none transition-colors">${t.name}</span>
                        ${extraUI}
                    `;
                    list.appendChild(row);
                });
                grpDiv.appendChild(list);
                grid.appendChild(grpDiv);
            });
            
            // Show/Hide Bracket Button based on exactly 8 selected
            if (allSelected) {
                actionBtn.classList.remove('hidden');
            } else {
                actionBtn.classList.add('hidden');
            }
        }

        function toggleThird(event, grpKey) {
            event.stopPropagation(); // Prevent drag event confusion
            
            if (selectedThirds.includes(grpKey)) {
                pushHistory();
                selectedThirds = selectedThirds.filter(g => g !== grpKey);
                saveEverything();
                renderGroupStage();
            } else {
                if (selectedThirds.length >= 8) {
                    const tracker = document.getElementById('thirds-tracker');

            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('application/x-wc-token', '1');
        }

        function handleDragOver(e) {
            if (e.preventDefault) e.preventDefault(); 
            e.dataTransfer.dropEffect = 'move';
            this.classList.add('drag-over');
            return false;
        }

        function handleDragLeave(e) { this.classList.remove('drag-over'); }

        function handleDrop(e, targetGroup, targetIndex) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopPropagation) e.stopPropagation();
            
            if (dragSrcGroup !== targetGroup) return false;

            if (dragSrcIndex !== targetIndex) {
                pushHistory();
                const groupArr = groupState[targetGroup];
                const temp = groupArr[dragSrcIndex];
                groupArr[dragSrcIndex] = groupArr[targetIndex];
                groupArr[targetIndex] = temp;
                
                // If bracket was generated, switching group places should clear the bracket predictions
                bracketState = {}; 
                saveEverything();
                renderGroupStage(); 
            }
            return false;
        }

        // --- 7. LOGIC: DYNAMIC BRACKET ASSIGNMENT ---
        
        // Generates the official 495 combinations and finds the deterministic lexicographical derangement for each
        function generateFIFATable() {
            const allGroups = ['A','B','C','D','E','F','G','H','I','J','K','L'];
            // Updated hosts based on official FIFA PDF schedule logic (A, B, D, E, G, I, K, L)
            const hostGroups = ['A','B','D','E','G','I','K','L'];
            
            function getCombinations(array, k) {
                let results = [];
                function helper(start, combo) {
                    if (combo.length === k) { results.push(combo); return; }
                    for (let i = start; i < array.length; i++) helper(i + 1, combo.concat(array[i]));
                }
                helper(0, []);
                return results;
            }

            function getFirstDerangement(combo, hosts) {
                let sortedCombo = [...combo].sort();
                let used = new Array(8).fill(false);
                let currentAssigment = [];
                let bestAssignment = null;

                function backtrack(index) {
                    if (bestAssignment) return;
                    if (index === 8) { bestAssignment = [...currentAssigment]; return; }
                    let host = hosts[index];
                    for (let i = 0; i < 8; i++) {
                        if (!used[i]) {
                            let candidate = sortedCombo[i];
                            if (candidate !== host) {
                                used[i] = true;
                                currentAssigment.push(candidate);
                                backtrack(index + 1);
                                currentAssigment.pop();
                                used[i] = false;
                            }
                        }
                    }
                }
                backtrack(0);
                return bestAssignment;
            }

            const combos = getCombinations(allGroups, 8);
            combos.forEach(combo => {
                const key = combo.sort().join('');
                FIFA_LOOKUP_TABLE[key] = getFirstDerangement(combo, hostGroups);
            });
            console.log(`FIFA Matrix Loaded: ${Object.keys(FIFA_LOOKUP_TABLE).length} Combinations calculated in memory.`);
        }

        // This dynamically assigns the 8 selected 3rd place teams to the 8 Group Winners
        // using the exact deterministic FIFA rule mapped out in the 495-combination matrix.
        function assignThirds(selected) {
            const key = [...selected].sort().join('');
            const assignmentArray = FIFA_LOOKUP_TABLE[key];
            const hosts = ['A','B','D','E','G','I','K','L'];
            let assignmentMap = {};
            
            // Fallback (mathematically unreachable since all 495 combos have derangements, but safe)
            if (!assignmentArray) {
                console.warn('Fallback assignment triggered');
                return hosts.reduce((acc, host, i) => ({...acc, [host]: selected[i]}), {});
            }
            
            hosts.forEach((h, i) => {
                assignmentMap[h] = assignmentArray[i];
            });
            
            return assignmentMap;
        }

                    <span class="bg-[#ccff00] text-black text-[10px] font-bold px-3 py-1 rounded mt-2 z-10">CHAMPION</span>
                `;
                box.classList.add('winner-final', 'shadow-[0_0_50px_#ccff00]');
            };
        }

        init();

    </script>
